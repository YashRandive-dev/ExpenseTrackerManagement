# Render Blueprint: New + > Blueprint > pick this repo. Secrets (sync: false) are asked for in the dashboard.
services:
  - type: web
    name: expense-tracker-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL        # your exact Vercel URL, no trailing slash
        sync: false
      - key: MAIL_RELAY_URL    # Apps Script web app URL (see backend/mail-relay/Code.gs); Render free blocks SMTP
        sync: false
      - key: MAIL_RELAY_SECRET # same SECRET string you put in Code.gs
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
